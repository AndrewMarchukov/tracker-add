name: Docker Image CI

on:
  push:
    branches: [ master ]
    paths:
      - Dockerfile
      - tracker-add-docker.sh
      - .github/workflows/docker-image.yml
  schedule:
    - cron: "17 5 * * *"   # daily poll; builds only when alpine ships a new version
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: andrewmhub/transmission-tracker-add

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check for a new alpine release
        id: alpine
        run: |
          set -euo pipefail
          version=$(docker run --rm alpine:latest cat /etc/alpine-release)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = schedule ] \
             && docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::alpine $version already built, nothing to do"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.alpine.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.alpine.outputs.build == 'true'

      - name: Build and push
        if: steps.alpine.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          build-args: ALPINE_VERSION=${{ steps.alpine.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.alpine.outputs.version }}
